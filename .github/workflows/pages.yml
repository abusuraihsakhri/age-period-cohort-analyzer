name: Deploy Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify live site
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location             --retry 8 --retry-delay 3 --retry-all-errors             "$PAGE_URL" -o /tmp/index.html
          grep -Fq "Age-Period-Cohort Analyzer" /tmp/index.html

          curl --fail --silent --show-error --location             --retry 8 --retry-delay 3 --retry-all-errors             "${PAGE_URL}app.js" -o /tmp/app.js
          grep -Fq "analyzeButton" /tmp/app.js

          curl --fail --silent --show-error --location             --retry 8 --retry-delay 3 --retry-all-errors             "${PAGE_URL}styles.css" -o /tmp/styles.css
          grep -Fq ".analysis-grid" /tmp/styles.css
