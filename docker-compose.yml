version: '3.8'

services:
  age-period-cohort-analyzer:
    build: .
    container_name: age-period-cohort-analyzer
    ports:
      - "8000:8000"
    environment:
      - AUDIT_SECRET_KEY=age-period-cohort-analyzer-prod-audit-key-2026
      - MODEL_PROVIDER=mock
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
